name: Update GitHub Stats Gist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --omit=dev

      - name: Update gist
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: 60c163e8cfaf7ff05167c29a3bef13b9
          ALL_COMMITS: true
          K_FORMAT: false
        run: |
          set -uo pipefail
          attempt=1
          max=3
          while true; do
            node index.js && exit 0
            status=$?
            if [ "$attempt" -ge "$max" ]; then
              echo "gist update failed after ${max} attempts" >&2
              exit "$status"
            fi
            delay=$((15 * attempt))
            echo "gist update attempt ${attempt}/${max} failed; retrying in ${delay}s" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done
